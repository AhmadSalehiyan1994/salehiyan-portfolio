name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: test-secret

      - name: Audit all public pages for SEO regressions
        run: npm run seo:audit

      - name: Save SEO audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit
          path: .next/seo-audit.json
          if-no-files-found: ignore
          retention-days: 14
